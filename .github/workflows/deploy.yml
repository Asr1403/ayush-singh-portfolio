name: Deploy Portfolio to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ayush0814/ayush-singh-portfolio:latest

            docker stop portfolio || true
            docker rm portfolio || true

            docker run -d \
              --name portfolio \
              --restart always \
              -p 3000:80 \
              ayush0814/ayush-singh-portfolio:latest

            sudo systemctl restart nginx
