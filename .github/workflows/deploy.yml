name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. Build and Push Job
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} 

      - name: Build and Push Docker Image
        run: |
          docker build -t ayush0814/ayush-singh-portfolio:latest .
          docker push ayush0814/ayush-singh-portfolio:latest

  # 2. Deploy Job
  deploy:
    needs: docker-build # Forces this job to wait for the build to finish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ayush0814/ayush-singh-portfolio:latest
            docker stop portfolio || true
            docker rm portfolio || true
            docker run -d \
              --name portfolio \
              --restart always \
              -p 8080:80 \
              ayush0814/ayush-singh-portfolio:latest
            sudo systemctl restart nginx
