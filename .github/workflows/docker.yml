name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ayush0814/ayush-singh-portfolio:latest .

      - name: Push Docker image
        run: |
          docker push ayush0814/ayush-singh-portfolio:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo docker pull ayush0814/ayush-singh-portfolio:latest

            sudo docker stop portfolio || true

            sudo docker rm portfolio || true

            sudo docker run -d \
              --name portfolio \
              -p 127.0.0.1:8080:80 \
              ayush0814/ayush-singh-portfolio:latest
